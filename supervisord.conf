[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:webapp]
command=/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/webapp.err.log
stdout_logfile=/var/log/supervisor/webapp.out.log

[program:pgadmin]
command=/usr/pgadmin4/venv/bin/python /usr/pgadmin4/web/pgAdmin4.py
directory=/usr/pgadmin4/web
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/pgadmin.err.log
stdout_logfile=/var/log/supervisor/pgadmin.out.log
environment=PGADMIN_SETUP_EMAIL="admin@admin.com",PGADMIN_SETUP_PASSWORD="admin",PGADMIN_PORT="5050",PGADMIN_BIND_ADDRESS="0.0.0.0"
