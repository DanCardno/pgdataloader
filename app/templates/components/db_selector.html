<div class="mb-6">
    <h3 class="font-medium text-gray-600 mb-3">2. Seed Agents & Customers</h3>
    <form hx-post="/seed-data" hx-target="#result">
        <select name="dbname" class="border border-gray-300 p-2 rounded w-full mb-3">
            {% if databases %}
                {% for db in databases %}
                    <option value="{{ db }}">{{ db }}</option>
                {% endfor %}
            {% else %}
                <option disabled>No databases found — create one first</option>
            {% endif %}
        </select>
        <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
            Seed Agents & Customers
        </button>
    </form>
</div>

<div class="border-t border-gray-200 pt-6">
    <h3 class="font-medium text-gray-600 mb-3">3. Seed Orders & Calls</h3>
    <form hx-post="/seed-orders" hx-target="#result">
        <select name="dbname" class="border border-gray-300 p-2 rounded w-full mb-3">
            {% if databases %}
                {% for db in databases %}
                    <option value="{{ db }}">{{ db }}</option>
                {% endfor %}
            {% else %}
                <option disabled>No databases found — create one first</option>
            {% endif %}
        </select>
        <input name="records" 
               type="number"
               min="1"
               class="border border-gray-300 p-2 rounded w-full mb-3"
               placeholder="Number of records to generate" required/>
        <button class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">
            Seed Orders & Calls
        </button>
    </form>
</div>
